# Serves the Angular build (P0-29). HTTPS, HSTS and /api routing belong to the reverse proxy (P0-30).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Client-side routes such as /groups/1 have no file; the Angular router handles them in index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current bundles, so the browser must always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundle names contain a content hash, so a file never changes under the same name.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
