# Dependency update pull requests (P0-28, NFR-SEC-11, DEC-080). Every pull request still passes the
# required CI checks, and the owner merges it.
#
# - Minor and patch updates are grouped into one pull request per ecosystem; major updates come one by one.
# - cooldown: a new version is proposed only after it has been out for 7 days (14 for major versions of NuGet
#   and npm packages), so a broken or withdrawn release is usually caught before it reaches us. Security
#   updates skip the cooldown.
# - Commit messages and titles follow Conventional Commits: chore(deps): ... / chore(deps-dev): ...
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore"]

  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Angular major versions are upgraded with `ng update`, which runs migrations that rewrite the code;
    # Dependabot cannot run them. Packages whose allowed versions are set by Angular move with it.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # angular-eslint aligns its major version with Angular's (angular-eslint README).
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      # @angular/build and @angular/compiler-cli accept only "typescript >=6.0 <6.1", so a new minor
      # version breaks the build as well; patch updates stay allowed.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Peer dependency ranges of the installed Angular packages: rxjs ^6.5.3 || ^7.4.0 (@angular/core),
      # tslib ^2.3.0 and vitest ^4.0.8 || ^5.0.0 (@angular/build).
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tslib"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:admin-web"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    # The SemVer-bump cooldown keys (semver-major-days etc.) are not supported for github-actions; only
    # default-days is (Dependabot options reference, "Configuration of cooldown").
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore"]
