name: Hata
description: Beklenmeyen bir davranış
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ne oldu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ne olmasını bekliyordun?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Nasıl tekrarlanır?
      value: |
        1.
        2.
        3.
  - type: input
    id: trace
    attributes:
      label: traceId (varsa)
  - type: input
    id: env
    attributes:
      label: Ortam
      placeholder: yerel / staging / production
