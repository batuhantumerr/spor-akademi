# Runs on every pull request to main and on every push to main (P0-28). The job names (backend, frontend,
# repo-checks, images) are the status checks that branch protection requires, so rename them only together with
# the ruleset. On a push to main, the publish job then pushes the tested images to GHCR (P0-31).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the jobs only read the repository; only the publish job may write packages.
permissions:
  contents: read

# A new commit on the same pull request cancels the run for the previous one. Runs on main are never
# cancelled: every commit on main must publish its images, so that any of them can be deployed (DEC-089).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Actions are pinned to a commit hash, not a movable tag; the comment shows the release it belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK version comes from global.json. The NuGet package cache is keyed on the lock files (P0-38).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore tools
        run: dotnet tool restore

      # Locked mode fails when a package resolves differently from packages.lock.json (P0-38, DEC-080).
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Check format
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build

      # The model and the migrations must match (ADR-0011). The command does not connect to the database,
      # but the design-time factory requires a connection string; this one has no password and no server.
      - name: Check for pending model changes
        env:
          ConnectionStrings__Migrator: Host=localhost;Database=spor_akademi;Username=spor_akademi_migrator
        run: >-
          dotnet ef migrations has-pending-model-changes --no-build
          --project src/SporAkademi.Infrastructure
          --startup-project src/SporAkademi.Api

      # Vulnerable NuGet packages need no separate step: every restore above audits direct and transitive
      # packages, and high or critical findings fail it (Directory.Build.props, DEC-080).
      - name: Check forbidden packages
        run: scripts/check-forbidden-packages.sh

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node version comes from .nvmrc (DEC-075); engine-strict makes npm ci fail on any other version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check format
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # High and critical findings fail the job; lower ones are listed in the output (DEC-080). A new
      # advisory can fail a build that passed yesterday without any code change.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  repo-checks:
    name: repo-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check final newlines
        run: scripts/check-final-newline.sh

      - name: Check that dotnet-ef matches EF Core
        run: scripts/check-ef-tool-version.sh

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No secrets are used here; the token stays read-only (workflow permissions) and is not stored on disk.
    env:
      # source links the GHCR package to this repository; revision records the commit the image was built from.
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      IMAGE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        run: >-
          docker build --file docker/api/Dockerfile --tag spor-akademi-api:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION" .

      - name: Smoke test API image
        run: scripts/smoke-test-api-image.sh spor-akademi-api:ci

      # Trivy (DEC-080, GHSA-69fq-xp46-6x23): the action is pinned to the commit of v0.36.0, an immutable
      # release published after the March 2026 compromise; it installs setup-trivy by commit hash. The Trivy
      # version is set explicitly (never "latest"); its install script verifies the tarball against the
      # release's SHA-256 checksums, and Trivy releases are immutable. High and critical findings fail the job.
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: spor-akademi-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Build admin image
        run: >-
          docker build --file docker/admin/Dockerfile --tag spor-akademi-admin:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION" .

      - name: Smoke test admin image
        run: scripts/smoke-test-admin-image.sh spor-akademi-admin:ci

      - name: Scan admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: spor-akademi-admin:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      # The migration bundle and its SQL script from one build (ADR-0011, DEC-089). The smoke test applies
      # the bundle to a throwaway PostgreSQL. The bundle is a single-file executable, so Trivy sees the OS
      # packages only; its NuGet packages are audited at restore (DEC-080).
      - name: Build migrator image
        run: >-
          docker build --file docker/migrator/Dockerfile --tag spor-akademi-migrator:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION" .

      - name: Smoke test migrator image
        run: scripts/smoke-test-migrator-image.sh spor-akademi-migrator:ci

      - name: Scan migrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: spor-akademi-migrator:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      # On main, the images that passed the smoke tests and the scans are handed to the publish job as they
      # are; publish does not rebuild them, so what is pushed is exactly what was tested (P0-31).
      - name: Save images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output images.tar spor-akademi-api:ci spor-akademi-admin:ci spor-akademi-migrator:ci

      - name: Upload images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    # Only after every check has passed, and only for commits on main; pull requests never publish.
    needs: [backend, frontend, repo-checks, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that may write packages (GHCR). The images are public (DEC-089) and contain no secrets.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The download fails if the artifact's digest differs from the one recorded at upload.
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      - name: Load images
        run: docker load --input images.tar

      # docker login stores the token in ~/.docker/config.json for the rest of the job; the last step logs out.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Tag: the full commit SHA only (DEC-089). Image names must be lowercase.
      - name: Publish images
        run: >-
          scripts/publish-images.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
          spor-akademi-api:ci spor-akademi-admin:ci spor-akademi-migrator:ci

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
